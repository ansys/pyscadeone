# cSpell:disable
[build-system]
requires = ["flit_core >=3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "ansys-scadeone-core"
dynamic = ["version"]
description = "Python interface for Ansys Scade One"
readme = "README.rst"
requires-python = ">=3.10,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" }]
maintainers = [{ name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "platformdirs>=4.9.6",
    "pythonnet>=3.1.0",
    "lark>=1.3.1",
]

[project.optional-dependencies]
frozen-dependencies = [
    # Indirect dependencies,
    "attrs==26.1.0",
    "cffi==2.0.0",
    "clr-loader==0.3.1",
    "jsonschema-specifications==2025.9.1",
    "markupsafe==3.0.3",
    "pycparser==3.0",
    "referencing==0.37.0",
    "rpds-py==0.30.0",
    # Direct dependencies,
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "platformdirs==4.9.6",
    "pythonnet==3.1.0",
    "lark==1.3.1",
]
tests = ["pytest>=9.0.3", "pytest-cov>=7.1.0", "click>=8.3.3", "fmpy>=0.3.29"]
doc = [
    "ansys-sphinx-theme==1.8.2",
    "numpydoc==1.10.0",
    "pillow==12.2.0",
    "pytest-sphinx==0.7.1",
    "sphinx==9.1.0",
    "sphinx-autobuild==2025.8.25",
    "sphinx-autodoc-typehints==3.10.3",
    "sphinx-copybutton==0.5.2",
    "sphinx-design==0.7.0",
    "sphinx-jinja==2.0.2",
]
checks = [
    "codespell==2.4.2",
    "pre-commit==4.6.0",
    "pyrefly==1.1.1",
    "ruff==0.15.20",
    "vale==3.13.0.0",
]

[project.urls]
source = "https://github.com/ansys/pyscadeone"
issues = "https://github.com/ansys/pyscadeone/issues"
documentation = "https://scadeone.docs.pyansys.com"
tracker = "https://github.com/ansys/pyscadeone/issues"

[project.scripts]
pyscadeone = "ansys.scadeone.core.cli:main"

[tool.flit.module]
name = "ansys.scadeone.core"

[tool.codespell]
skip = 'spelling_ok.txt,*.ipynb,*.dll,*.so,./.git*,./doc,./tests,./tmp,fmi*.[hc]'
ignore-words = "./doc/styles/config/vocabularies/ANSYS/accept.txt"
ignore-regex = 'incr ment' # detected in ./tests/scadeone/core/swan/test_pragmas.py:707
quiet-level = 3

# Test & Coverage
[tool.coverage.run]
source = ["pyscadeone"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
# not in pytest-tmp, to avoid deletion
log_file = "logs/pytest.log"
# pytest temporary files are in tests/pytest-tmp to avoid polluting the main tests folder
# and to shortern the paths from Windows limitations when using model files
addopts = "--basetemp=tests/pytest-tmp"
# keep the tmp folder for failed tests only. Other options: "all", "none"
tmp_path_retention_policy = "failed"
# avoid collecting tests from imported modules, ex. TestPragma
collect_imported_tests = false
# don't recurse into these directories
norecursedirs = [".venv", "doc", "examples", "tests/pytest-tmp"]

[tool.ruff]
line-length = 100
extend-exclude = ["test_printer.py", "test_pragmas.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E4", "E7", "E9", "F", "W"]
ignore = ["F403"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyrefly]
project-includes = ["src", "tests", "doc"]
project-excludes = [
    "src/ansys/scadeone/core/common/**",
    "src/ansys/scadeone/core/model/**",
    "src/ansys/scadeone/core/svc/common/**",
    "src/ansys/scadeone/core/svc/generated_code/**",
    "src/ansys/scadeone/core/svc/pywrapper/**",
    "src/ansys/scadeone/core/svc/simdata/**",
    "src/ansys/scadeone/core/svc/swan_creator/diagram_creator.py",
    "src/ansys/scadeone/core/svc/swan_creator/harness_creator.py",
    "src/ansys/scadeone/core/svc/swan_creator/job_creator.py",
    "src/ansys/scadeone/core/svc/swan_creator/module_creator.py",
    "src/ansys/scadeone/core/svc/swan_creator/operator_creator.py",
    "src/ansys/scadeone/core/svc/swan_creator/project_creator.py",
    "src/ansys/scadeone/core/svc/swan_visitor/**",
    "src/ansys/scadeone/core/svc/test/**",
    "src/ansys/scadeone/core/svc/build_system.py",
    "src/ansys/scadeone/core/svc/swan_printer.py",
    "src/ansys/scadeone/core/swan/diagram.py",
    "src/ansys/scadeone/core/swan/pragmas.py",
    "src/ansys/scadeone/core/job.py",
    "src/ansys/scadeone/core/project.py",
    "src/ansys/scadeone/core/scadeone.py",
    "tests/**",
    "doc/**",
]
ignore-missing-imports = ["platformdirs"]

[tool.numpydoc_validation]
checks = [
    #"all",   # report on all checks, except the below
    # "GL01", # "Docstring text (summary) should start in the line immediately "
    # "after the opening quotes (not in the same line, or leaving a "
    # "blank line in between)",
    # "GL02", # "Closing quotes should be placed in the line after the last text "
    # "in the docstring (do not close the quotes in the same line as "
    # "the text, or leave a blank line between the last text and the "
    # "quotes)",
    # "GL03", # "Double line break found; please use only one blank line to "
    # "separate sections or paragraphs, and do not leave blank lines "
    # "at the end of docstrings",
    "GL05", # 'Tabs found at the start of line "{line_with_tabs}", please use '
    # "whitespace only",
    "GL06", # 'Found unknown section "{section}". Allowed sections are: '
    # "{allowed_sections}",
    # "GL07", # "Sections are in the wrong order. Correct order is: {correct_sections}",
    # "GL08", # "The object does not have a docstring",
    # "GL09", # "Deprecation warning should precede extended summary",
    "GL10", # "reST directives {directives} must be followed by two colons",
    # "SS01", # "No summary found (a short summary in a single line should be "
    # "present at the beginning of the docstring)",
    "SS02", # "Summary does not start with a capital letter",
    # "SS03", # "Summary does not end with a period",
    "SS04", # "Summary contains heading whitespaces",
    # "SS05", # FIXME "Summary must start with infinitive verb, not third person "
    # '(e.g. use "Generate" instead of "Generates")',
    # "SS06", # "Summary should fit in a single line",
    # "ES01", # "No extended summary found",
    # "PR01", # FIXME "Parameters {missing_params} not documented",
    # "PR02", # "Unknown parameters {unknown_params}",
    "PR03", # "Wrong parameters order. Actual: {actual_params}. "
    # "Documented: {documented_params}",
    # "PR04", # 'Parameter "{param_name}" has no type',
    "PR05", # 'Parameter "{param_name}" type should not finish with "."',
    "PR06", # 'Parameter "{param_name}" type should use "{right_type}" instead '
    # 'of "{wrong_type}"',
    # "PR07", # FIXME 'Parameter "{param_name}" has no description',
    # "PR08", # FIXME 'Parameter "{param_name}" description should start with a '
    # "capital letter",
    # "PR09", # 'Parameter "{param_name}" description should finish with "."',
    # "PR10", # 'Parameter "{param_name}" requires a space before the colon '
    # "separating the parameter name and type",
    # "RT01", # "No Returns section found",
    # "RT02", # "The first line of the Returns section should contain only the "
    # "type, unless multiple values are being returned",
    # "RT03", # "Return value has no description",
    "RT04", # "Return value description should start with a capital letter",
    # "RT05", # 'Return value description should finish with "."',
    # "YD01", # "No Yields section found",
    # "SA01", # "See Also section not found",
    "SA02", # "Missing period at end of description for See Also "
    # '"{reference_name}" reference',
    "SA03", # "Description should be capitalized for See Also "
    # '"{reference_name}" reference',
    "SA04", # 'Missing description for See Also "{reference_name}" reference',
    # "EX01", # "No examples section found",    
]
exclude = ['\.__repr__$', '\.__str__$', '\.__init__$']

[tool.towncrier]
directory = "doc/changelog"
filename = "doc/source/changelog.rst"
template = "doc/changelog/template"
start_string = ".. towncrier release notes start\n"
title_format = "`{version} <https://github.com/ansys/pyscadeone/releases/tag/v{version}>`_ - {project_date}"
issue_format = "`#{issue} <https://github.com/ansys/pyscadeone/pull/{issue}>`_"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

